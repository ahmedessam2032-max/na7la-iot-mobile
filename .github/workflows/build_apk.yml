name: Build Na7la IoT Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.3'
          channel: 'stable'
          cache: true

      - name: Cache Gradle Dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Install Flutter Dependencies
        run: |
          cd mobile_app
          flutter pub get

      - name: Build Android Release APK
        run: |
          cd mobile_app
          flutter build apk --release

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Na7la-IoT-Release-APK
          path: mobile_app/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.3.1
          name: "Na7la IoT v1.3.1 — Official Android APK"
          body: |
            ## 🐝 تطبيق نحلة إنترنت الأشياء Na7la IoT v1.3.1 (Official Pure Flutter Release)
            
            ### 📱 محتويات التحديث:
            - **التوأم الرقمي الأصلي (MTTL-W01 Digital Twin):** واجهة Pure Flutter داكنة وتفاعلية بالكامل مع لمبات LED نيون خضراء وحمراء على صورة المشترك الحقيقي.
            - **محرك الربط المصنعي المتكامل (Native Provisioning Engine):** تسلسل الأوامر الثلاثي (up:ip و up:connect و up:reboot:0) مع تجاوز باقة الموبايل 4G وحظر الرمز (:) وتنبيهات شبكات 2.4 GHz والربط اليدوي البديل.
            - **تأمين مخرج الراوتر بالـ PIN:** حماية الإنترنت المنزلي من الانقطاع العرضي.
            - **الربط السحابي مع AWS:** مراقبة الواط والجهد والتحكم الفوري من أي مكان.
          files: |
            mobile_app/build/app/outputs/flutter-apk/app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
