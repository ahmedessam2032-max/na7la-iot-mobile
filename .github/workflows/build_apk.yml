name: Build Na7la IoT Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.3'
          channel: 'stable'
          cache: true

      - name: Cache Gradle Dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Install Flutter Dependencies
        run: |
          cd mobile_app
          flutter pub get

      - name: Build Android Release APK
        run: |
          cd mobile_app
          flutter build apk --release

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Na7la-IoT-Release-APK
          path: mobile_app/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30

      - name: Build Flutter Web Sandbox
        run: |
          cd mobile_app
          flutter config --enable-web
          flutter create --platforms web .
          flutter build web --release --base-href "/"
          cd build/web
          zip -r ../../../na7la-web-build.zip .

      - name: Upload Web Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Na7la-IoT-Web-Build
          path: mobile_app/build/web
          if-no-files-found: error
          retention-days: 30

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.0.0
          name: "Na7la IoT v2.0.0 — Zero-Knowledge AES-256-GCM Security + WattQ 1.0.27 UI"
          body: |
            ## ⚡ تطبيق نحلة إنترنت الأشياء Na7la IoT v2.0.0 (Zero-Knowledge Encrypted Edition)
            
            ### 🔐 التشفير الشامل وحماية الخصوصية (Zero-Knowledge Architecture — Server v2.1.0):
            - **تشفير قاعدة البيانات (`AES-256-GCM` + `HMAC-SHA256` Blind Indexes):** تشفير عناوين `MAC` و `IP` وأسماء المشتركات والمقابس والبريد الإلكتروني ومفاتيح الـ Webhook بالكامل على مستوى القرص.
            - **تشفير كلمات المرور والـ PIN (`bcrypt`) وأكواد الـ OTP (`HMAC-SHA256`)** باتجاه واحد غير قابل للعكس مع إبطال فوري للجلسات القديمة (`token_version`) عند تغيير كلمة المرور.
            - **عزل انعدام المعرفة للأدمن (`Zero-Knowledge Admin Console`):** إخفاء عناوين `MAC` و `IP` وأسماء الأجهزة تماماً عن لوحة الإدارة ومنع الوصول المتقاطع بين المستخدمين.
            - **حماية Brute-Force (`RateLimiter`) وتوثيق WebSocket المقفل.**
            
            ### ✨ الواجهة المتكاملة والربط الفعلي بالعتاد:
            1. **🎨 تصميم Material 3 (Emerald Green #10B981):** كروت المخارج 2x2، المجسم التفاعلي للمشترك، ألوان المخارج، ربط المجموعات، وضع الجرس، وتثبيت الحالة.
            2. **📊 مراقب الطاقة وسجل تشغيل الـ 30 يوماً:** حساب الشرائح المصرية التصاعدية وتصدير CSV.
            3. **🛡️ درع الحماية المتكامل وصحة المشترك:** حماية الجهد والأحمال مع استثناء الراوتر.
            - تطوير وبرمجة: م. أحمد عصام (Eng. Ahmed Essam).
          files: |
            mobile_app/build/app/outputs/flutter-apk/app-release.apk
            na7la-web-build.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
