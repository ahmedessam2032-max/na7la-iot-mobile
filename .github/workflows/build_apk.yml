name: Build Na7la IoT Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.3'
          channel: 'stable'
          cache: true

      - name: Cache Gradle Dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Install Flutter Dependencies
        run: |
          cd mobile_app
          flutter pub get

      - name: Build Android Release APK
        run: |
          cd mobile_app
          flutter build apk --release

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Na7la-IoT-Release-APK
          path: mobile_app/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30

      - name: Build Flutter Web Sandbox
        run: |
          cd mobile_app
          flutter config --enable-web
          flutter create --platforms web .
          flutter build web --release --base-href "/"
          cd build/web
          zip -r ../../../na7la-web-build.zip .

      - name: Upload Web Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Na7la-IoT-Web-Build
          path: mobile_app/build/web
          if-no-files-found: error
          retention-days: 30

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.4.1
          name: "Na7la IoT v1.4.1 — Material Energy Analytics, Unlocked Router Guard & UI Localization"
          body: |
            ## 🐝 تطبيق نحلة إنترنت الأشياء Na7la IoT v1.4.1 (Production Release)
            
            ### 🛠️ الإصلاحات الجذرية للواجهة والأمان والترجمة (UI & Security Fixes):
            
            1. **⚡ حل مشكلة تعديل اسم المشترك وتحديثه الفوري:**
               - تحديث صلاحيات الـ Backend لتمكين مالك المشترك من تغيير اسمه وغرفته فوراً.
               - تحديث الحالة المحلية بالواجهة فور نجاح التعديل دون الحاجة لإعادة تشغيل التطبيق.
            
            2. **📊 ترقية وتصميم شاشة إحصائيات الطاقة والتحليلات (Material Scaffold):**
               - بناء الشاشة داخل `Scaffold` كامل و`AppBar` حديث مع زر رجوع متناسق.
               - القضاء نهائياً على مشكلة النصوص التحذيرية الحمراء والخطوط الصفراء.
            
            3. **🔓 فك قفل فيشة الراوتر برمز PIN الماستر:**
               - إزالة الإجبار التلقائي للقفل على خادم السحابة، وإتاحة فك قفل الراوتر بكل حرية عند التحقق من هوية المستخدم.
            
            4. **🌐 التوطين الشامل وتفعيل اللغة الإنجليزية ديناميكياً:**
               - دعم الترجمة الفورية لتبويب الإعدادات (Settings Tab) وتحديث الواجهة تلقائياً عند تغيير اللغة.
               - تعريب/ترجمة التوأم الرقمي (Digital Twin Card)، وقائمة الخيارات (3-dots menu)، والهيدر، وكروت المخارج.
          files: |
            mobile_app/build/app/outputs/flutter-apk/app-release.apk
            na7la-web-build.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
