name: Build Na7la IoT Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.3'
          channel: 'stable'
          cache: true

      - name: Cache Gradle Dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Install Flutter Dependencies
        run: |
          cd mobile_app
          flutter pub get

      - name: Build Android Release APK
        run: |
          cd mobile_app
          flutter build apk --release

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Na7la-IoT-Release-APK
          path: mobile_app/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30

      - name: Build Flutter Web Sandbox
        run: |
          cd mobile_app
          flutter config --enable-web
          flutter create --platforms web .
          flutter build web --release --base-href "/"
          cd build/web
          zip -r ../../../na7la-web-build.zip .

      - name: Upload Web Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Na7la-IoT-Web-Build
          path: mobile_app/build/web
          if-no-files-found: error
          retention-days: 30

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.4.0
          name: "Na7la IoT v1.4.0 — Security Master Controls, Smart Cutoff & UI Perfection"
          body: |
            ## 🐝 تطبيق نحلة إنترنت الأشياء Na7la IoT v1.4.0 (Production Release)
            
            ### 🛡️ تحديثات الأمان وحماية الأفياش ودقة البيانات الحسابية:
            
            1. **🔓 إمكانية إلغاء قفل الفيش ورمز PIN بالكامل:**
               - خيار جديد في الإعدادات يتيح للمستخدم إيقاف رمز الـ PIN وإلغاء قفل جميع المخارج نهائياً بعد التحقق من الهوية.
               - شارة ذكية توضح حالة القفل (`مفعّل 🔐` أو `غير مفعّل 🔓`).
            
            2. **⚡ الفصل الذكي (Smart Cutoff) بالثواني:**
               - تعديل التسمية من "فصل الشحن الذكي" إلى "الفصل الذكي (Smart Cutoff)".
               - ضبط مهلة الفصل بالثواني المباشرة بدلاً من الدقائق لحماية البطاريات والأجهزة الحساسة فور اكتمال الشحن.
            
            3. **📊 تحسين عرض الواط والأمبير ومنع انعكاس الوحدات (BiDi RTL Fix):**
               - تأطير الوحدات الهندسية باتجاه صارم LTR لمنع قلب الأرقام (`63.1 W • 0.27 A` و `31°C`).
               - تكبير زر القفل في كارت الفيشة وتوسيع مساحة اللمس لتسهيل التفاعل المباشر.
            
            4. **🛡️ أمان استثناء المخارج المقفولة عند إيقاف الكل:**
               - تحصين أمر "إيقاف الكل الذكي" لاستثناء كل من فيشة الراوتر والمخارج المقفولة يدوياً تلقائياً.
               - إزالة المفتاح غير الموثق من نافذة تفاصيل المخرج لضمان عدم تجاوز كلمة السر أو البصمة.
            
            5. **🎨 معالجة تداخل النصوص والـ SnackBars العائمة:**
               - إصلاح مشكلة تداخل نص أقصى واط (Max W) في درع التحميل الزائد.
               - رفع رسائل التنبيهات (SnackBars) لتطفو فوق شريط التنقل السفلي دون حجبه.
          files: |
            mobile_app/build/app/outputs/flutter-apk/app-release.apk
            na7la-web-build.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
