name: Build Na7la IoT Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.3'
          channel: 'stable'
          cache: true

      - name: Cache Gradle Dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Install Flutter Dependencies
        run: |
          cd mobile_app
          flutter pub get

      - name: Build Android Release APK
        run: |
          cd mobile_app
          flutter build apk --release

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Na7la-IoT-Release-APK
          path: mobile_app/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.3.3
          name: "Na7la IoT v1.3.3 — Official Android APK (Cloud Parity & Full i18n)"
          body: |
            ## 🐝 تطبيق نحلة إنترنت الأشياء Na7la IoT v1.3.3 (Official Pure Flutter Release)
            
            ### 📱 أبرز إضافات وتحسينات هذا الإصدار:
            - **زر تبديل اللغة الفوري (English 🇺🇸 / العربية 🇸🇦):** زر بيضاوي في أعلى شاشات الدخول ولوحة التحكم يقلب اتجاه الواجهة فوراً (RTL / LTR) مع ترجمة كاملة ومزامنة التفضيل سحابياً.
            - **استعادة كلمة المرور عبر كود OTP الإيميل:** مسار سحابي تفاعلي من 3 خطوات مربوط بمحرك الـ OTP المباشر على سيرفر AWS مع مؤقت زمني 10 دقائق.
            - **فحص كوتة المشتركات (Quota Gating):** نافذة ترقية الخطة الذكية عند بلوغ حد المشتركات مع زر واتساب مباشر للتواصل مع الإدارة.
            - **قائمة الدعم الفني والخدمات:** وصول مباشر لدعم الواتساب ولينكد إن المطور، وباقات الأسعار، ومعلومات المنصة.
            - **إرشادات كلمة المرور الآمنة:** بطاقة إرشادية وتأكيد حماية الحسابات.
            - **التوأم الرقمي ومحرك درويش المصنعي:** تجاوز داتا 4G/5G لربط المشترك تلقائياً بدون تعليق.
          files: |
            mobile_app/build/app/outputs/flutter-apk/app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
