name: Build Na7la IoT Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.3'
          channel: 'stable'
          cache: true

      - name: Cache Gradle Dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Install Flutter Dependencies
        run: |
          cd mobile_app
          flutter pub get

      - name: Build Android Release APK
        run: |
          cd mobile_app
          flutter build apk --release

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Na7la-IoT-Release-APK
          path: mobile_app/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.3.7
          name: "Na7la IoT v1.3.7 — Repeating Cycles, Home Widget & LAN Controller"
          body: |
            ## 🐝 تطبيق نحلة إنترنت الأشياء Na7la IoT v1.3.7 (Official Production Release)
            
            ### 🚀 أقوى المميزات الحصرية المقتبسة من الهندسة العكسية للتطبيقات المنافسة (WattQ & Siam):
            
            1. **🔄 دورات التشغيل والإيقاف المتكررة (Repeating Cycles) [من WattQ]:**
               - إمكانية تشغيل وإيقاف أي فيشة بدورات زمنية دورية لا نهائية (مثل تشغيل 15 دقيقة وإيقاف 45 دقيقة).
               - نماذج جاهزة بلمسة واحدة: الثلاجات والتبريد (20د تشغيل / 40د إيقاف)، مضخات المياه (30د/60د)، الشفاطات والتهوية (10د/20د)، وإضاءة المزارع/النباتات (8س/16س).
               - خوارزمية ذكية مدمجة في السيرفر لحماية كمبروسر الثلاجات والمحركات وضمان الاستمرارية حتى لو كان الهاتف غير متصل.
               
            2. **📱 ويدجت الشاشة الرئيسية التفاعلي (Interactive Android Home Widget) [من WattQ]:**
               - ويدجت أنيق لشاشة الهاتف الرئيسية يعرض إجمالي استهلاك الواط، جهد الكهرباء اللحظي، وحالة المشترك والمخارج دون الحاجة لفتح التطبيق.
               - مزامنة فورية تلقائية مع البث اللحظي عبر WebSocket.
               
            3. **🏠 نمط الاتصال المحلي بدون إنترنت (Offline Local LAN Mode) [من Siam]:**
               - خادم TCP محلي مدمج في تطبيق الهاتف يستمع على المنفذ `10086`.
               - خيار تبديل النمط من قائمة الثلاث نقاط (Controller Target Mode) للتحكم المباشر والمحلي في المشترك داخل الشبكة المنزلية حتى عند انقطاع الإنترنت الخارجي.
               
            ### 🛡️ بروتوكول قفل الأطفال على مستوى الهاردوير (Child Lock MCU Protocol):
            - دعم أمر الهاردوير `up:childlock:31` و `up:childlock:0` لقفل الأزرار اللمسية الفيزيائية في المشترك لمنع عبث الأطفال نهائياً.
          files: |
            mobile_app/build/app/outputs/flutter-apk/app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
