name: Build Na7la IoT Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.3'
          channel: 'stable'
          cache: true

      - name: Cache Gradle Dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Install Flutter Dependencies
        run: |
          cd mobile_app
          flutter pub get

      - name: Build Android Release APK
        run: |
          cd mobile_app
          flutter build apk --release

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Na7la-IoT-Release-APK
          path: mobile_app/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.3.8
          name: "Na7la IoT v1.3.8 — WATTQ-Inspired Redesign & Advanced Protection"
          body: |
            ## 🐝 تطبيق نحلة إنترنت الأشياء Na7la IoT v1.3.8 (Official Production Release)
            
            ### 🎨 إعادة بناء الواجهة بالكامل مستوحاة من نضج WATTQ وهوية نحلة الملكية:
            
            1. **📱 الواجهة الرئيسية الموحدة (Zen Focus Dashboard):**
               - تحويل الشاشة الرئيسية لشاشة واحدة أنيقة لا تحتاج لأي سكرول.
               - دمج التوأم الرقمي الرشيق (Compact Digital Twin) مع ليدات نيون ذكية تكشف حالة الأفياش الأربعة.
               - شريط التيليميتري الموحد (واط، أمبير، فولت، حرارة، وتكلفة اليوم بدقة).
               - شبكة المقابس 2x2 المتناسقة بدون أي إيموجي كارتوني واستبدالها بأيقونات فيكتور رسمية من Material Symbols Rounded.
               - إزالة الزر العائم (FAB) لتنظيف شريط التنقل ومربعات الحوار.
            
            2. **💎 نظام الألوان السيراميكي (Ceramic Light) والأوبسيديان (Midnight Obsidian):**
               - حل مشكلة تباين الوايت مود بنسبة 100% (WCAG AAA) بنقاء السيراميك والرمادي الناعم واستئصال الخطوط الكارتونية السوداء.
               - توهج عسلي دافئ وراقٍ للمخارج المفعلة دون استنساخ.
            
            3. **⚡ منظومة حماية الواط التفاعلية (Interactive Watt Guard):**
               - فصل الشحن الذكي (Low-Watt Cutoff): فصل تلقائي عند اكتمال الشحن أو انخفاض الواط.
               - درع التحميل الزائد للمخرج (Overload Watt Guard): فصل فوري إذا تجاوز الحمل الحد الأقصى.
               - الإطفاء التلقائي الدائم (Inching Mode): مخرج يفصل أوتوماتيكياً بعد مدة كل ما يشتغل.
               - درع الكمبروسر 180 ثانية لحماية مواتير الثلاجات والتكييف.
            
            4. **🔐 أمان المقابس ورمز PIN الماستر الحقيقي والبصمة:**
               - إلغاء أي أرقام هاردكودد سابقة، وتفعيل إعداد رمز PIN الخاص بالمستخدم لأول مرة مع البصمة الفورية.
            
            5. **⏰ مركز الجدولة والأتمتة الحقيقي (Real Automation Tab):**
               - عرض الجداول والمؤقتات النشطة مع مفاتيح إيقاف/استئناف وحذف، وإضافة المؤقت التنازلي والدورات المتكررة والجدول الأسبوعي.
            
            6. **🔒 حجب صلاحيات الأدمن الصارم:**
               - إخفاء كوتة الأدمن وبوابة الإدارة نهائياً عن المستخدم العادي.
            
            7. **💰 حاسبة تسعيرة الكيلوواط الديناميكية:**
               - إمكانية تحديد سعر الكيلوواط في الإعدادات لحساب الفاتورة بدقة حسب شريحة المستخدم.
          files: |
            mobile_app/build/app/outputs/flutter-apk/app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
