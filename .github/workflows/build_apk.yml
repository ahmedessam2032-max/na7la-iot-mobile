name: Build Na7la IoT Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.3'
          channel: 'stable'
          cache: true

      - name: Cache Gradle Dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Install Flutter Dependencies
        run: |
          cd mobile_app
          flutter pub get

      - name: Build Android Release APK
        run: |
          cd mobile_app
          flutter build apk --release

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Na7la-IoT-Release-APK
          path: mobile_app/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30

      - name: Build Flutter Web Sandbox
        run: |
          cd mobile_app
          flutter config --enable-web
          flutter create --platforms web .
          flutter build web --release --base-href "/"
          cd build/web
          zip -r ../../../na7la-web-build.zip .

      - name: Upload Web Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Na7la-IoT-Web-Build
          path: mobile_app/build/web
          if-no-files-found: error
          retention-days: 30

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.0.0
          name: "Na7la IoT v2.0.0 — Complete WattQ 1.0.27 UI Overhaul + Full Real Backend Integration"
          body: |
            ## ⚡ تطبيق نحلة إنترنت الأشياء Na7la IoT v2.0.0 (WattQ 1.0.27 Edition + Exclusive Hardware Features)
            
            ### ✨ التحديث الشامل للواجهة والربط الكامل مع السيرفر السحابي:
            1. **🎨 تصميم Material 3 الجديد كلياً (Emerald Green #10B981):**
               - كروت المخارج 2x2 مع قراءات الأمبير والواط والحرارة وشارات الحماية.
               - المجسم الحقيقي التفاعلي للمشترك (Hardware Digital Twin) قابل للطي والتوسيع.
               - تخصيص ألوان المخارج (6 ألوان)، ربط المجموعات (Link Group 1..4)، وضع الجرس (Doorbell Mode)، تثبيت الحالة (Pin State)، وإعادة التشغيل لمدة 5 ثوانٍ.
            2. **📊 مراقب الطاقة وسجل تشغيل الـ 30 يوماً (Run Log):**
               - حساب الفاتورة بالشرائح المصرية التصاعدية (7 شرائح) أو بالسعر الثابت.
               - سجل جلسات التشغيل الفردية لكل مخرج وتصدير تقرير Excel/CSV.
            3. **🛡️ درع الحماية المتكامل وصحة المشترك (24h & 7d Health):**
               - استثناء مخارج من فصل الجهد، إعادة التشغيل التلقائي بعد استقرار الجهد، وحالة العودة بعد انقطاع الكهرباء.
               - تطوير وبرمجة: م. أحمد عصام (Eng. Ahmed Essam).
          files: |
            mobile_app/build/app/outputs/flutter-apk/app-release.apk
            na7la-web-build.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
