name: Build Na7la IoT Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.3'
          channel: 'stable'
          cache: true

      - name: Cache Gradle Dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Install Flutter Dependencies
        run: |
          cd mobile_app
          flutter pub get

      - name: Build Android Release APK
        run: |
          cd mobile_app
          flutter build apk --release

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Na7la-IoT-Release-APK
          path: mobile_app/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.3.5
          name: "Na7la IoT v1.3.5 — 100% HTML Parity, 3-Dots Menu & Child Lock"
          body: |
            ## 🐝 تطبيق نحلة إنترنت الأشياء Na7la IoT v1.3.5 (Official Production Release)
            
            ### 📱 أبرز تحديثات وإصلاحات هذا الإصدار:
            - **حل مشكلة ارتداد زرار الفيشة رقم 1 (Darwish Pending & Rollback):** حجز المفتاح لمنع الضغط المزدوج مع فحص رد السيرفر والتراجع الفوري (Rollback) عند فشل الطلب أو بطء الشبكة، وتوحيد حقول `action` و `state`.
            - **زر وقائمة الثلاث نقاط الشاملة (`⋮` - 10 خيارات مطابقة للـ HTML):** إعادة تسمية، جدولة، إحصائيات الطاقة، سجل النشاط، فحص الهاردوير، قفل الأطفال، حماية الجهد، مشاركة العائلة، قفل PIN، وحذف المشترك.
            - **ميزة وشارة قفل الأطفال (Child Lock):** نافذة تفعيل تفاعلية، ظهور شارة ذهبية أنيقة في رأس الكارت، وربط التعديلات سحابياً بالسيرفر.
            - **فحص وتشخيص المشترك والهاردوير (Diagnostics من دراسة WattQ):** شيت منبثق يعرض الجهد وقوة إشارة الواي فاي والـ IP وإصدار الفيرموير.
            - **شريط مؤشرات الطاقة العلوي (Hero KPI) وكوتة المشتركات:** بطاقات الملخص الثلاث (مشترك / متصل / واط) ومحدد كوتة الأدمن أعلى الشاشة.
            - **إخفاء وإظهار الماك أدريس:** زر إظهار الماك بلمسة واحدة على أيقونة العين.
          files: |
            mobile_app/build/app/outputs/flutter-apk/app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
