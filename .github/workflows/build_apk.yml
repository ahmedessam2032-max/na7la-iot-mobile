name: Build Na7la IoT Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.3'
          channel: 'stable'
          cache: true

      - name: Cache Gradle Dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Install Flutter Dependencies
        run: |
          cd mobile_app
          flutter pub get

      - name: Build Android Release APK
        run: |
          cd mobile_app
          flutter build apk --release

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Na7la-IoT-Release-APK
          path: mobile_app/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.3.9
          name: "Na7la IoT v1.3.9 — Biometric App Lock & Per-Socket Current & Lock Control"
          body: |
            ## 🐝 تطبيق نحلة إنترنت الأشياء Na7la IoT v1.3.9 (Production Release)
            
            ### 🔐 منظومة الأمان الحيوية وقفل التطبيق وتفاصيل الأمبير الفردية:
            
            1. **🔓 قفل ومحرك البصمة الحقيقي على أندرويد (Biometric Engine):**
               - ترقية `MainActivity` لترث من `FlutterFragmentActivity` لتفعيل مستشعر البصمة الحيوي رسمياً على جميع هواتف أندرويد.
               - تفعيل البصمة التلقائية في مربعات الحوار دون الحاجة لكتابة الـ PIN يدوياً كل مرة.
            
            2. **📱 قفل التطبيق بالكامل بالبصمة (App Lock with Biometrics):**
               - مفتاح تحكم مخصص في الإعدادات لتفعيل قفل التطبيق بالبصمة عند الفتح أو العودة من الخلفية.
               - شاشة قفل دورة حياة التطبيق الرشيقة (AppLockGate) بألوان الأوبسيديان والسيراميك الملكي.
            
            3. **🔒 زر تفاعلي لقفل كل فيشة مباشرة من الكارت (Per-Socket Lock Control):**
               - إضافة زر قفل تفاعلي (🔓 / 🔒) في رأس كل كارت فيشة لتغيير حالة قفل المخرج بنقرة واحدة.
               - إمكانية قفل وفك قفل المخرج بالبصمة فورياً أو برمز PIN، مع ربطه بباك إند المنصة.
               - تفعيل تدفق تسجيل رمز PIN والبصمة لأول مرة للمستخدم الجديد تلقائياً.
            
            4. **⚡ عرض أمبير كل فيشة على حدة (Per-Socket Live Current):**
               - إظهار قراءة الأمبير اللحظية (A) بجانب الواط (W) في السطر السفلي لكارت كل مخرج (`64.6W • 0.27A`).
               - عرض شريط التيليميتري الثلاثي (واط، أمبير، حرارة) في رأس نافذة تفاصيل وحماية المخرج.
            
            5. **🛠️ معالجة مسارات الـ API:**
               - دعم الحقول المزدوجة `locked` و `is_locked` مع التحقق الآمن من رمز الـ PIN لمنع أخطاء 400 Bad Request.
          files: |
            mobile_app/build/app/outputs/flutter-apk/app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
