name: Build Na7la IoT Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.3'
          channel: 'stable'
          cache: true

      - name: Cache Gradle Dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Install Flutter Dependencies
        run: |
          cd mobile_app
          flutter pub get

      - name: Build Android Release APK
        run: |
          cd mobile_app
          flutter build apk --release

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Na7la-IoT-Release-APK
          path: mobile_app/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.3.4
          name: "Na7la IoT v1.3.4 — Rock-Solid Strip Provisioning & Real-Time Sync"
          body: |
            ## 🐝 تطبيق نحلة إنترنت الأشياء Na7la IoT v1.3.4 (Official Production Release)
            
            ### 📱 أبرز تحديثات وإصلاحات هذا الإصدار:
            - **حل مشكلة اكتشاف المشترك في أندرويد 10-14+ (GPS & Location):** فحص حالة خدمات الموقع GPS مع زر مباشر لفتح الإعدادات لتظهر شبكات المشترك فوراً.
            - **مسار الربط المباشر السريع (طريقة باي درويد 🚀):** إمكانية إرسال إعدادات الواي فاي والسيرفر فوراً إلى المشترك على `192.168.1.1:30300` للمستخدمين المتصلين بشبكة المشترك.
            - **إدخال كود المشترك المباشر (4 رموز):** إمكانية كتابة آخر 4 رموز من اسم المشترك لتحديد شبكته واحتساب كلمة المرور تلقائياً.
            - **حل مشكلة ظهور المشترك "أوفلاين" (Offline Fix):** مزامنة فورية لحالة الاتصال مع رسائل الـ WebSocket + إضافة السحب لأسفل للتحديث (`RefreshIndicator`) + مؤقت دوري خفيف في الخلفية.
            - **قراءة ردود المشترك المصنعية (Handshake Verification):** التحقق من استلام ردود `ip_ok` و `connect_ok` قبل إرسال أمر إعادة التشغيل (Reboot).
            - **إصلاح حلقة التحقق السحابي في المعالج:** فحص حالة اتصال المشترك الحقيقية على AWS لتأكيد النجاح بدقة واحترافية.
          files: |
            mobile_app/build/app/outputs/flutter-apk/app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
