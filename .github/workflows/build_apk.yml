name: Build Na7la IoT Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.3'
          channel: 'stable'
          cache: true

      - name: Cache Gradle Dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Install Flutter Dependencies
        run: |
          cd mobile_app
          flutter pub get

      - name: Build Android Release APK
        run: |
          cd mobile_app
          flutter build apk --release

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Na7la-IoT-Release-APK
          path: mobile_app/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.3.0
          name: "Na7la IoT v1.3.0 — Official Android APK"
          body: |
            ## 🐝 تطبيق نحلة إنترنت الأشياء Na7la IoT v1.3.0 (Official Release)
            
            ### 📱 محتويات التحديث:
            - **الإعداد التلقائي بالواي فاي (Native Provisioning):** يدعم الربط المباشر مع شبكة المشترك `TONLY_TAP_...` وإرسال أوامر التهيئة المصنعية (`up:ip:` و `up:connect:`).
            - **المحاكاة الفيزيائية الحية (Hardware Digital Twin):** مزامنة لحظية لحالة الفيشات الأربعة (أخضر يعمل / أحمر مطفأ).
            - **حماية الراوتر الذكية:** منع انقطاع الإنترنت عن المنزل بطلب رمز PIN عند التحكم في مخرج الراوتر.
            - **الربط السحابي مع AWS:** مراقبة الواط والجهد والتحكم الفوري من أي مكان.
          files: |
            mobile_app/build/app/outputs/flutter-apk/app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
