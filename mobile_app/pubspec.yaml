name: na7la_iot
description: "Na7la IoT Smart Strip Official Mobile Application"
publish_to: 'none'
version: 1.3.0+4

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State Management & DI
  flutter_riverpod: ^2.5.1

  # Networking & Realtime WebSockets
  http: ^1.2.1
  web_socket_channel: ^3.0.0

  # Hardware Security & Biometrics
  flutter_secure_storage: ^9.2.2
  local_auth: ^2.2.0

  # Wi-Fi Discovery & Android Integration
  wifi_scan: ^0.4.0
  home_widget: ^0.6.0

  # Charts & UI Aesthetics
  fl_chart: ^0.68.0
  google_fonts: ^6.2.1
  intl: ^0.19.0
  path_provider: ^2.1.3
  share_plus: ^9.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/icons/app_icon.png
